name: CI

on:
  push:
    branches: [ "**" ]
  pull_request:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Vernuko.sln
      - run: dotnet build Vernuko.sln -c Release --no-restore
      - run: dotnet test tests/Vernuko.Tests/Vernuko.Tests.csproj -c Release --no-build

  windows:
    name: Build, test and UI smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Vernuko.sln
      - run: dotnet build Vernuko.sln -c Release --no-restore
      - run: dotnet test tests/Vernuko.Tests/Vernuko.Tests.csproj -c Release --no-build
      - name: Publish desktop app
        run: dotnet publish src/Vernuko.Desktop/Vernuko.Desktop.csproj -c Release -r win-x64 --self-contained -o publish
      - name: UI smoke test (all screens, binding errors fail the build)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke"
          $p = Start-Process -FilePath "publish\Vernuko.exe" -ArgumentList "--smoke-test", "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out "smoke-report.txt") -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item -Path (Join-Path $out "*") -Destination smoke -Recurse -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed with exit code $($p.ExitCode)"; exit $p.ExitCode }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vernuko-smoke-screenshots
          path: smoke
          if-no-files-found: warn

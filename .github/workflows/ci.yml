name: CI

# Public repository: GitHub-hosted runners are free. The same checks also run locally with kontrol.cmd (Windows).
on:
  push:
    branches: [ "**" ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Vernuko.sln
      - run: dotnet build Vernuko.sln -c Release --no-restore
      - run: dotnet test tests/Vernuko.Tests/Vernuko.Tests.csproj -c Release --no-build
      - name: WordPress license plugin (PHP lint + core tests)
        run: |
          php -v
          for f in wordpress/vernuko-license/*.php wordpress/vernuko-license/src/*.php wordpress/vernuko-license/tests/*.php; do php -l "$f"; done
          php wordpress/vernuko-license/tests/core-test.php
      - name: Package WordPress plugin
        run: |
          mkdir -p wp-plugin && cd wordpress && zip -r ../wp-plugin/vernuko-license.zip vernuko-license -x "vernuko-license/tests/*"
      - name: Upload WordPress plugin
        uses: actions/upload-artifact@v4
        with:
          name: vernuko-license-wordpress-plugin
          path: wp-plugin/vernuko-license.zip
          if-no-files-found: error
      - name: Publish license server (linux-x64)
        run: dotnet publish src/Vernuko.LicenseServer/Vernuko.LicenseServer.csproj -c Release -r linux-x64 --self-contained -o license-server
      - name: Upload license server
        uses: actions/upload-artifact@v4
        with:
          name: vernuko-license-server-linux-x64
          path: license-server
          if-no-files-found: error

  windows:
    name: Build, test and UI smoke test (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet restore Vernuko.sln
      - run: dotnet build Vernuko.sln -c Release --no-restore
      - run: dotnet test tests/Vernuko.Tests/Vernuko.Tests.csproj -c Release --no-build
      - name: Compute version
        shell: pwsh
        run: |
          $base = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1
          "VERNUKO_VERSION=$base-ci.${{ github.run_number }}" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Publish desktop app
        run: dotnet publish src/Vernuko.Desktop/Vernuko.Desktop.csproj -c Release -r win-x64 --self-contained -p:Version=${{ env.VERNUKO_VERSION }} -o publish
      - name: UI smoke test (all screens, binding errors fail the build)
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke"
          $p = Start-Process -FilePath "publish\Vernuko.exe" -ArgumentList "--smoke-test", "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out "smoke-report.txt") -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path smoke | Out-Null
          Copy-Item -Path (Join-Path $out "*") -Destination smoke -Recurse -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed with exit code $($p.ExitCode)"; exit $p.ExitCode }
      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vernuko-smoke-screenshots
          path: smoke
          if-no-files-found: warn
      - name: Build installer (Velopack, unsigned CI build)
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet vpk pack --packId VernukoApp --packVersion $env:VERNUKO_VERSION --packDir publish --mainExe Vernuko.exe `
            --packTitle Vernuko --packAuthors Vernuko --icon src/Vernuko.Desktop/Assets/vernuko.ico --runtime win-x64 --outputDir releases
          Get-ChildItem releases
      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: vernuko-installer-ci
          path: |
            releases/*-Setup.exe
            releases/*-Portable.zip
          if-no-files-found: error

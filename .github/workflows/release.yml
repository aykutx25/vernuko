name: Release

# Builds a release from a version tag (e.g. v0.2.0) and uploads it as a DRAFT GitHub release.
# Nothing is published to customers until the owner reviews and publishes the draft.
on:
  push:
    tags: [ "v*" ]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  # Passed through the environment (not interpolated into scripts).
  TAG_NAME: ${{ github.ref_name }}
  REPO_URL: https://github.com/${{ github.repository }}
  VERNUKO_UPDATE_URL: ${{ vars.VERNUKO_UPDATE_URL }}

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Version from tag
        shell: pwsh
        run: |
          $v = $env:TAG_NAME.TrimStart("v")
          if ($v -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') { Write-Error "Tag must look like v1.2.3"; exit 1 }
          "VERNUKO_VERSION=$v" | Out-File -FilePath $env:GITHUB_ENV -Append
      - run: dotnet restore Vernuko.sln
      - run: dotnet build Vernuko.sln -c Release --no-restore
      - run: dotnet test tests/Vernuko.Tests/Vernuko.Tests.csproj -c Release --no-build
      - name: Publish desktop app
        # VERNUKO_UPDATE_URL is a repository *variable* (not a secret): the HTTPS address of the update feed,
        # e.g. https://github.com/<owner>/<public-releases-repo> or a static host. Empty = no auto-update.
        shell: pwsh
        run: dotnet publish src/Vernuko.Desktop/Vernuko.Desktop.csproj -c Release -r win-x64 --self-contained "-p:Version=$env:VERNUKO_VERSION" "-p:VernukoUpdateUrl=$env:VERNUKO_UPDATE_URL" -o publish
      - name: UI smoke test
        shell: pwsh
        run: |
          $out = Join-Path $env:RUNNER_TEMP "smoke"
          $p = Start-Process -FilePath "publish\Vernuko.exe" -ArgumentList "--smoke-test", "`"$out`"" -Wait -PassThru
          Get-Content (Join-Path $out "smoke-report.txt") -ErrorAction SilentlyContinue
          if ($p.ExitCode -ne 0) { Write-Error "Smoke test failed with exit code $($p.ExitCode)"; exit $p.ExitCode }
      - name: Previous release (for delta updates)
        continue-on-error: true
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet tool restore
          dotnet vpk download github --repoUrl $env:REPO_URL --token $env:GH_TOKEN --outputDir releases
      - name: Pack installer
        # Code signing: add --signParams (signtool) or --azureTrustedSignFile once an OV/EV certificate is available.
        # Until then the installer is unsigned and Windows SmartScreen will warn; never ask customers to disable it.
        shell: pwsh
        run: |
          dotnet tool restore
          dotnet vpk pack --packId VernukoApp --packVersion $env:VERNUKO_VERSION --packDir publish --mainExe Vernuko.exe `
            --packTitle Vernuko --packAuthors Vernuko --icon src/Vernuko.Desktop/Assets/vernuko.ico --runtime win-x64 `
            --releaseNotes CHANGELOG.md --outputDir releases
      - name: Upload draft GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          dotnet vpk upload github --repoUrl $env:REPO_URL --token $env:GH_TOKEN `
            --outputDir releases --releaseName "Vernuko $env:VERNUKO_VERSION" --tag $env:TAG_NAME
      - uses: actions/upload-artifact@v4
        with:
          name: vernuko-installer-${{ env.VERNUKO_VERSION }}
          path: releases
